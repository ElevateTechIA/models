<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Peaky Blinder with flat cap (gorra volteada) -->

  <!-- Smoke wisp behind -->
  <path d="M62 28 Q65 20 60 14 Q58 10 62 6" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M58 30 Q62 22 57 16 Q55 12 58 8" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round" opacity="0.3"/>

  <!-- Head/Face silhouette -->
  <ellipse cx="50" cy="58" rx="18" ry="22" fill="#1a1a1a"/>

  <!-- Neck -->
  <rect x="43" y="76" width="14" height="8" rx="2" fill="#1a1a1a"/>

  <!-- Coat collar / shoulders -->
  <path d="M30 84 L43 78 L50 82 L57 78 L70 84 L72 98 L28 98 Z" fill="#2a2a2a"/>
  <!-- Collar lapels -->
  <path d="M43 78 L46 90 L50 82 L54 90 L57 78" fill="none" stroke="#d4a030" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Coat buttons -->
  <circle cx="50" cy="92" r="1.5" fill="#d4a030"/>

  <!-- Ear shadows -->
  <ellipse cx="33" cy="56" rx="3" ry="5" fill="#151515"/>
  <ellipse cx="67" cy="56" rx="3" ry="5" fill="#151515"/>

  <!-- Flat cap (gorra volteada - tilted forward) -->
  <!-- Cap body -->
  <path d="M28 48 Q30 34 50 32 Q70 34 72 48 L68 50 Q50 46 32 50 Z" fill="#3a3028"/>
  <!-- Cap brim (visor) - angled forward/down -->
  <path d="M28 48 Q26 50 24 50 Q22 52 28 52 L32 50 Z" fill="#2a2218"/>
  <!-- Cap band -->
  <path d="M32 49 Q50 45 68 49" fill="none" stroke="#d4a030" stroke-width="1.5"/>
  <!-- Cap top seam -->
  <path d="M50 32 L50 46" fill="none" stroke="#2a2218" stroke-width="0.8" opacity="0.5"/>
  <!-- Button on top -->
  <circle cx="50" cy="33" r="2" fill="#d4a030"/>

  <!-- Shadow under cap (covers eyes area) -->
  <path d="M32 50 Q50 46 68 50 Q66 56 50 54 Q34 56 32 50 Z" fill="#0d0d0d" opacity="0.85"/>

  <!-- Eyes barely visible under shadow -->
  <ellipse cx="42" cy="52" rx="2.5" ry="1.2" fill="#c8a84c" opacity="0.7"/>
  <ellipse cx="58" cy="52" rx="2.5" ry="1.2" fill="#c8a84c" opacity="0.7"/>

  <!-- Nose -->
  <path d="M50 56 L48 62 L52 62 Z" fill="#222" opacity="0.5"/>

  <!-- Mouth / jaw line -->
  <path d="M44 68 Q50 70 56 68" fill="none" stroke="#333" stroke-width="1" stroke-linecap="round"/>

  <!-- Cigarette -->
  <rect x="56" y="66" width="12" height="2.5" rx="1" fill="#e8dcc8" transform="rotate(-15, 56, 67)"/>
  <!-- Cigarette tip (burning) -->
  <circle cx="67.5" cy="63.5" r="2" fill="#d4a030"/>
  <circle cx="67.5" cy="63.5" r="1.2" fill="#ff6b35" opacity="0.8"/>

  <!-- Razor blade in cap (the "peaky" part) -->
  <path d="M28 48 L22 46 L24 44 L28 46" fill="#c0c0c0" stroke="#999" stroke-width="0.5"/>
</svg>
